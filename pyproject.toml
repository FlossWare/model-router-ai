[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-router-ai"
version = "0.2"
description = "Decorator-based LLM model router with cost-aware, budget-tracking, and policy-enforcing composable layers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Scot P. Floess", email = "sfloess@nc.rr.com"}]
keywords = ["llm", "model-router-ai", "ai", "decorator-pattern", "cost-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/FlossWare/model-router-ai"
Repository = "https://github.com/FlossWare/model-router-ai"
Issues = "https://github.com/FlossWare/model-router-ai/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "bandit"]

[tool.setuptools.packages.find]
include = ["model_router_ai*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disable_error_code = ["no-any-return"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
