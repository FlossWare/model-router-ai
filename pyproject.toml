[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-router-ai"
version = "0.1.0"
description = "Decorator-based LLM model router with cost-aware, budget-tracking, and policy-enforcing composable layers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Scot P. Floess", email = "sfloess@gmail.com"},
]
keywords = ["llm", "model-router-ai", "ai", "decorator-pattern", "cost-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/FlossWare/model-router-ai"
Repository = "https://github.com/FlossWare/model-router-ai"
Issues = "https://github.com/FlossWare/model-router-ai/issues"

[tool.setuptools.packages.find]
include = ["model_router_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
